<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namma Mitra Logs</title>
<link rel="icon" href="/static/img/gok_logo.jpg">
<style>
:root { --bg:#0f1419; --card:#161d24; --line:#26313b; --txt:#e6edf3; --sub:#8b98a5; --green:#3fb950; --red:#f85149; --blue:#58a6ff; --amber:#d29922; }
* { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--txt); font:14px "Segoe UI","Nirmala UI",Arial,sans-serif; }
header { display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:2; flex-wrap:wrap; }
header img { width:34px; height:34px; border-radius:50%; background:#fff; } header h1 { font-size:17px; margin:0; font-weight:600; }
header .sp { flex:1; }
input, select, button { background:#0d1117; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:7px 10px; font:inherit; }
button { cursor:pointer; } button:hover { border-color:var(--blue); }
main { display:grid; grid-template-columns:minmax(320px, 38%) 1fr; height:calc(100vh - 59px); }
#list { overflow-y:auto; border-right:1px solid var(--line); }
.tr { padding:9px 14px; border-bottom:1px solid var(--line); cursor:pointer; display:grid; grid-template-columns:62px 1fr auto; gap:8px; align-items:center; }
.tr:hover, .tr.on { background:#1c2630; }
.tr .id { font-family:Consolas,monospace; color:var(--blue); }
.tr .k { font-weight:600; } .tr .in { color:var(--sub); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tr .st { font-size:12px; padding:2px 8px; border-radius:10px; } .ok { background:rgba(63,185,80,.15); color:var(--green); } .error { background:rgba(248,81,73,.15); color:var(--red); } .running { background:rgba(210,153,34,.15); color:var(--amber); }
#detail { overflow-y:auto; padding:16px 20px; }
.empty { color:var(--sub); padding:40px; text-align:center; }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:14px; }
.card h3 { margin:0 0 8px; font-size:14px; color:var(--sub); font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
pre { margin:0; white-space:pre-wrap; word-break:break-word; font:12.5px Consolas,monospace; color:#c9d1d9; }
.call { border-left:2px solid var(--line); padding:6px 10px; margin:3px 0; cursor:pointer; }
.call:hover { background:#1a222b; } .call.err { border-left-color:var(--red); background:rgba(248,81,73,.06); }
.call .fn { font-family:Consolas,monospace; } .call .mod { color:var(--sub); } .call .ms { color:var(--amber); font-size:12px; float:right; }
.call .body { display:none; margin-top:6px; } .call.open .body { display:block; }
.call .lbl { color:var(--blue); font-size:12px; margin-top:4px; }
.msg { padding:6px 10px; border-radius:6px; margin:4px 0; white-space:pre-wrap; font-size:13px; }
.msg.in { background:#0b3d33; margin-left:30%; } .msg.out { background:#1f2c34; margin-right:30%; }
.copy { font-size:12px; padding:3px 8px; }
@media (max-width:800px) { main { grid-template-columns:1fr; height:auto; } #list { max-height:40vh; } }
</style>
</head>
<body>
<header>
  <img src="/static/img/gok_logo.jpg" alt=""><h1>Namma Mitra · Trace Logs <small style="font-weight:400;color:#8b98a5">Government of Karnataka</small></h1>
  <span class="sp"></span>
  <input id="goto" placeholder="Go to trace #" size="12">
  <input id="sess" placeholder="Filter session id" size="22">
  <label><input type="checkbox" id="errs"> errors only</label>
  <label><input type="checkbox" id="auto" checked> auto-refresh</label>
  <button id="refresh">Refresh</button>
</header>
<main>
  <section id="list"></section>
  <section id="detail"><div class="empty">Select a trace. Every user action = one trace; every function call inside it is listed with args, result, errors and timing.<br><br>Report issues as <b>"trace N: what you expected"</b>.</div></section>
</main>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const qs = new URLSearchParams(location.search);
  if (qs.get("session")) $("#sess").value = qs.get("session");
  let selected = qs.get("trace") ? Number(qs.get("trace")) : null;
  const pretty = s => { try { return JSON.stringify(JSON.parse(s), null, 2); } catch (e) { return s || ""; } };
  const when = ts => new Date(ts * 1000).toLocaleTimeString();

  async function loadList() {
    const sess = $("#sess").value.trim();
    const r = await fetch("/api/traces?limit=200" + (sess ? "&session=" + encodeURIComponent(sess) : ""));
    let { traces } = await r.json();
    if ($("#errs").checked) traces = traces.filter(t => t.status === "error");
    $("#list").innerHTML = traces.map(t => {
      let inp = ""; try { const j = JSON.parse(t.input); inp = j.text || j.label || (j.service ? j.service + (j.screen ? " / " + j.screen : "") : "") || j.payment_id || ""; } catch (e) {}
      return `<div class="tr ${t.id === selected ? "on" : ""}" data-id="${t.id}"><span class="id">#${t.id}</span>
        <div><div class="k">${esc(t.kind)} <span class="in">${esc(when(t.started_at))} · ${(t.duration_ms || 0).toFixed(0)} ms</span></div><div class="in">${esc(inp)}</div></div>
        <span class="st ${t.status}">${t.status}</span></div>`;
    }).join("") || '<div class="empty">No traces yet.</div>';
    document.querySelectorAll(".tr").forEach(el => el.onclick = () => show(Number(el.dataset.id)));
  }

  async function show(id) {
    selected = id;
    history.replaceState(null, "", "/logs?trace=" + id + ($("#sess").value ? "&session=" + encodeURIComponent($("#sess").value) : ""));
    document.querySelectorAll(".tr").forEach(el => el.classList.toggle("on", Number(el.dataset.id) === id));
    const r = await fetch("/api/logs?trace=" + id);
    const { trace, calls, messages } = await r.json();
    if (!trace) { $("#detail").innerHTML = `<div class="empty">Trace #${id} not found.</div>`; return; }
    const summary = `trace ${id} | ${trace.kind} | ${trace.status} | session ${trace.session_id}`;
    let html = `<div class="card"><h3>Trace #${id} · ${esc(trace.kind)} · <span class="st ${trace.status}">${trace.status}</span>
      <button class="copy" id="copy">Copy summary</button></h3>
      <pre>session: ${esc(trace.session_id)}\ntime: ${esc(new Date(trace.started_at * 1000).toLocaleString())}\nduration: ${(trace.duration_ms || 0).toFixed(1)} ms</pre></div>`;
    html += `<div class="card"><h3>Input</h3><pre>${esc(pretty(trace.input))}</pre></div>`;
    if (trace.error) html += `<div class="card" style="border-color:var(--red)"><h3 style="color:var(--red)">Error</h3><pre>${esc(trace.error)}</pre></div>`;
    if (messages.length) html += `<div class="card"><h3>Messages</h3>${messages.map(m => {
      let p = {}; try { p = JSON.parse(m.payload); } catch (e) {}
      return `<div class="msg ${m.dir}">${esc(p.text || (p.doc ? "📄 " + p.doc.name : p.type))}${p.cta ? "\n[" + esc(p.cta.label) + "]" : ""}${(p.buttons || []).map(b => "\n(" + esc(b.label) + ")").join("")}</div>`;
    }).join("")}</div>`;
    html += `<div class="card"><h3>Function calls (${calls.length})</h3>${calls.map(c => `
      <div class="call ${c.error ? "err" : ""}" style="margin-left:${c.depth * 18}px">
        <span class="ms">${(c.duration_ms || 0).toFixed(1)} ms</span><span class="mod">${esc(c.module)}.</span><span class="fn">${esc(c.func)}</span>${c.error ? ` <b style="color:var(--red)">✖ ${esc(c.error)}</b>` : ""}
        <div class="body"><div class="lbl">args</div><pre>${esc(pretty(c.args))}</pre><div class="lbl">${c.error ? "error" : "result"}</div><pre>${esc(c.error || pretty(c.result))}</pre></div>
      </div>`).join("")}</div>`;
    $("#detail").innerHTML = html;
    document.querySelectorAll(".call").forEach(el => el.onclick = e => { if (!e.target.closest("pre")) el.classList.toggle("open"); });
    $("#copy").onclick = () => navigator.clipboard && navigator.clipboard.writeText(summary);
  }

  $("#refresh").onclick = loadList;
  $("#sess").onchange = loadList; $("#errs").onchange = loadList;
  $("#goto").onkeydown = e => { if (e.key === "Enter") show(Number($("#goto").value.replace("#", ""))); };
  setInterval(() => { if ($("#auto").checked) loadList(); }, 3000);
  loadList().then(() => { if (selected) show(selected); });
})();
</script>
</body>
</html>
